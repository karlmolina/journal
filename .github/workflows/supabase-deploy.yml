name: Deploy Supabase on merge
on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:
concurrency:
  group: supabase-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Read from secrets first, falling back to repository variables.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || vars.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_REFERENCE_ID || vars.SUPABASE_REFERENCE_ID }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      - name: 🛠️ Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: 🔗 Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: 🗄️ Run database migrations
        run: supabase db push --linked
      - name: ⚡ Deploy edge functions
        run: |
          if [ -d supabase/functions ] && [ -n "$(ls -A supabase/functions)" ]; then
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
          else
            echo "No edge functions to deploy."
          fi
